server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # API-ответы динамические и должны быть свежими каждый раз (например,
        # после назначения места статус заявки меняется) — запрещаем браузеру
        # кэшировать их вообще, а не полагаться на эвристики.
        add_header Cache-Control "no-store";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Проект ещё в активной разработке: без этого браузер кэширует
        # index.html/css/js и после правок в frontend/ на экране остаётся
        # старая версия, пока не сделать жёсткий рефреш.
        add_header Cache-Control "no-cache";
    }
}
