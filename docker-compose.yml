services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghost_reloc_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghost_reloc_service}
      POSTGRES_DB: ${POSTGRES_DB:-ghost_reloc_service}
    volumes:
      - ghost_reloc_service_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghost_reloc_service}"]
      interval: 5s
      timeout: 5s
      retries: 10


  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ghost_reloc_service}:${POSTGRES_PASSWORD:-ghost_reloc_service}@db:5432/${POSTGRES_DB:-ghost_reloc_service}
    depends_on:
      db:
        condition: service_healthy

  # Ещё один одноразовый сервис: заполняет базу демонстрационными данными,
  # если их там ещё нет (проверка — внутри seed_data/run_seed.py). Запускается
  # после миграций, а не при каждом старте backend'а.
  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m seed_data.run_seed
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ghost_reloc_service}:${POSTGRES_PASSWORD:-ghost_reloc_service}@db:5432/${POSTGRES_DB:-ghost_reloc_service}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ghost_reloc_service}:${POSTGRES_PASSWORD:-ghost_reloc_service}@db:5432/${POSTGRES_DB:-ghost_reloc_service}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend/logs:/app/backend/logs
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  ghost_reloc_service_db_data:
